services:
  ytdownloader_web:
    init: true
    build:
      context: .
    container_name: ytdownloader_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:9000 --workers 3 --timeout 120"
    env_file:
      - .env
    environment:
      - DEBUG=False
      - USE_POSTGRES=True
      - POSTGRES_HOST=global_postgres15
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://uhuru_pos_redis:6379/0
      - REDIS_CACHE_URL=redis://uhuru_pos_redis:6379/1
      - CELERY_BROKER_URL=redis://uhuru_pos_redis:6379/0
      - CELERY_RESULT_BACKEND=redis://uhuru_pos_redis:6379/0
      - ALLOWED_HOSTS=yt-downloader.csambila.com
      - USE_TLS_PROXY=True
      - CSRF_TRUSTED_ORIGINS=https://yt-downloader.csambila.com
    volumes:
      - ytdownloader_staticfiles:/app/staticfiles
      - ytdownloader_media:/app/media
      - ytdownloader_temp_downloads:/app/temp_downloads
    networks:
      - sambilanet
    mem_limit: 1024m
    cpus: "1.5"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=sambilanet"

      - "traefik.http.routers.ytdownloader.rule=Host(`yt-downloader.csambila.com`)"
      - "traefik.http.routers.ytdownloader.entrypoints=websecure"
      - "traefik.http.routers.ytdownloader.tls.certresolver=production"
      - "traefik.http.services.ytdownloader.loadbalancer.server.port=9000"

      - "traefik.http.routers.ytdownloader-http.rule=Host(`yt-downloader.csambila.com`)"
      - "traefik.http.routers.ytdownloader-http.entrypoints=web"
      - "traefik.http.routers.ytdownloader-http.middlewares=redirect-https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"

      - "traefik.http.middlewares.ytdownloader-sec.headers.browserXssFilter=true"
      - "traefik.http.middlewares.ytdownloader-sec.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.ytdownloader-sec.headers.frameDeny=true"
      # no-referrer strips Referer and breaks Django CSRF when Origin is null; keep same-origin referrers
      - "traefik.http.middlewares.ytdownloader-sec.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.ytdownloader-sec.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.ytdownloader-sec.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.ytdownloader-sec.headers.stsPreload=true"

      - "traefik.http.middlewares.ytdownloader-ratelimit.ratelimit.average=120"
      - "traefik.http.middlewares.ytdownloader-ratelimit.ratelimit.burst=80"

      - "traefik.http.middlewares.ytdownloader-compress.compress=true"
      - "traefik.http.routers.ytdownloader.middlewares=ytdownloader-ratelimit,ytdownloader-sec,ytdownloader-compress"

  ytdownloader_worker:
    init: true
    build:
      context: .
    container_name: ytdownloader_worker
    restart: unless-stopped
    command: celery -A core worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      - DEBUG=False
      - USE_POSTGRES=True
      - POSTGRES_HOST=global_postgres15
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://uhuru_pos_redis:6379/0
      - REDIS_CACHE_URL=redis://uhuru_pos_redis:6379/1
      - CELERY_BROKER_URL=redis://uhuru_pos_redis:6379/0
      - CELERY_RESULT_BACKEND=redis://uhuru_pos_redis:6379/0
      - C_FORCE_ROOT=true
    volumes:
      - ytdownloader_media:/app/media
      - ytdownloader_temp_downloads:/app/temp_downloads
    networks:
      - sambilanet
    mem_limit: 768m
    cpus: "1.0"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ytdownloader_beat:
    init: true
    build:
      context: .
    container_name: ytdownloader_beat
    restart: unless-stopped
    command: celery -A core beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    environment:
      - DEBUG=False
      - USE_POSTGRES=True
      - POSTGRES_HOST=global_postgres15
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://uhuru_pos_redis:6379/0
      - REDIS_CACHE_URL=redis://uhuru_pos_redis:6379/1
      - CELERY_BROKER_URL=redis://uhuru_pos_redis:6379/0
      - CELERY_RESULT_BACKEND=redis://uhuru_pos_redis:6379/0
      - C_FORCE_ROOT=true
    volumes:
      - ytdownloader_media:/app/media
      - ytdownloader_temp_downloads:/app/temp_downloads
    networks:
      - sambilanet
    mem_limit: 384m
    cpus: "0.50"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  ytdownloader_staticfiles:
  ytdownloader_media:
  ytdownloader_temp_downloads:

networks:
  sambilanet:
    external: true
