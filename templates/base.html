<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Video Downloader{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="text-xl font-bold text-blue-600">
                    <a href="{% url 'home' %}">Video Downloader</a>
                </div>
                <div class="space-x-4">
                    {% if user.is_authenticated %}
                        <a href="{% url 'my_downloads' %}" class="text-gray-700 hover:text-blue-600">My Downloads</a>
                        <a href="{% url 'admin:logout' %}" class="text-gray-700 hover:text-blue-600">Logout</a>
                    {% else %}
                        <a href="{% url 'admin:login' %}" class="text-gray-700 hover:text-blue-600">Login</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
    
    <main class="py-8">
        {% block content %}{% endblock %}
    </main>
    
    {% block scripts %}{% endblock %}
</body>
</html>
